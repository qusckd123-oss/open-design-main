name: trend-verified-market

on:
  schedule:
    # 0 0 * * * (UTC) = Daily 09:00 Asia/Seoul.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trend-verified-market
  cancel-in-progress: false

jobs:
  collect:
    name: Verified market collector (END, RAKUTEN_FASHION)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Production Neon connection only - never DASHBOARD_ACCESS_CODE,
      # SESSION_SECRET, or any of the POSTGRES_MIGRATION_URL /
      # SQLITE_EXPORT_DATABASE_URL / POSTGRES_VERIFICATION_URL
      # migration-only variables. This workflow must only ever run
      # scripts/collect-market.ts --verified-only (idempotent upsert into
      # MarketProduct / MarketRankingSnapshot / ImportRun, never a schema
      # change, migration, seed, or reparse).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # MARKET_COLLECTOR_USER_AGENT is optional (the collector falls back to
      # a built-in default when unset) and intentionally not wired here -
      # this workflow uses the DATABASE_URL repository secret only.
    steps:
      - name: Verify DATABASE_URL secret is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL repository secret is not set. Add it under Settings > Secrets and variables > Actions before running this workflow." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: feature/trend-dashboard

      - name: Verify workspace
        run: |
          if [ ! -f "apps/trend-dashboard/package.json" ]; then
            echo "::error::apps/trend-dashboard/package.json not found" >&2
            exit 1
          fi
          PACKAGE_NAME=$(grep '"name"' apps/trend-dashboard/package.json | head -1 | grep -o '"@open-design/trend-dashboard"')
          if [ "$PACKAGE_NAME" != '"@open-design/trend-dashboard"' ]; then
            echo "::error::apps/trend-dashboard/package.json name mismatch: expected @open-design/trend-dashboard" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # --ignore-scripts: the root postinstall (scripts/postinstall.mjs)
      # builds packages/sidecar-proto, packages/sidecar, packages/platform,
      # tools/dev, and tools/pack - none of which apps/trend-dashboard's
      # collect:verified-market script imports. Skipping it keeps this
      # workflow to only what the collector actually needs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Canonical runtime Prisma client only (prisma/schema.prisma, the
      # PostgreSQL/DATABASE_URL schema) - never the sqlite-export client,
      # which this workflow has no use for.
      - name: Generate Prisma client
        run: pnpm --filter @open-design/trend-dashboard run db:generate

      - name: Run verified market collector
        run: pnpm --filter @open-design/trend-dashboard run collect:verified-market
